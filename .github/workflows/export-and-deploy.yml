name: Build, Export, and Deploy to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://relocationlogic.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'

      - name: Install dependencies
        run: npm ci

      - name: Build & Export
        run: npm run export

      - name: Generate salary pages (postexport)
        run: npm run postexport

      - name: Restore static hosting rules
        run: cp public/.htaccess out/.htaccess

      - name: Verify salary page content
        run: |
          test -f out/salary/new-york-ny/software-engineer/index.html
          grep -q "Salary Overview" out/salary/new-york-ny/software-engineer/index.html

      - name: Verify hosting rules exist
        run: test -f out/.htaccess

      - name: Verify export folder exists
        run: ls -la out || (echo "out/ not found" && exit 1)

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          local-dir: out/
          server-dir: ${{ secrets.CPANEL_FTP_PATH }}/
